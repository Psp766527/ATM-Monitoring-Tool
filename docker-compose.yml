version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  app:
    build: .
    container_name: kinective-atm-app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/atmMonitor
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ./logs:/app/logs

volumes:
  mongodb_data:
    driver: local
